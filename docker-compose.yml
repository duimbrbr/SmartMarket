services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smartmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db]
